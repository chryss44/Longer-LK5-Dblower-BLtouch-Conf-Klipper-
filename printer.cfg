# This file contains common pin mappings for MKS Robin E3 V1.1 boards. To
# use this config, the firmware should be compiled for the STM32F103.
# When running "make menuconfig", enable "extra low-level
# configuration setup", select the 20KiB bootloader, and serial (on
# USART1 PA10/PA9) communication.
# Note that the "make flash" command does not work with MKS Robin
# boards. After running "make", run the following command:
#   ./scripts/update_mks_robin.py out/klipper.bin out/Robin_e3.bin
# Copy the file out/Robin_e3.bin to an SD card and then restart the
# printer with that SD card.

# MKS Robin E3 has onboard TMC2209. This config can also be used for
# MKS Robin E3D if equipped with TMC2209 stepper drivers.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PC0
dir_pin: !PB2
enable_pin: !PC13
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA12
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PC2
dir_pin: PB9
enable_pin: !PB12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA11
position_endstop: 0
position_max: 300
homing_speed: 50


[stepper_z]
step_pin: PC14
dir_pin: !PC15
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min : -3
position_max: 400

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 16
rotation_distance: 34.5576
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control = pid
pid_kp = 29.909
pid_ki = 1.829
pid_kd = 122.253
min_temp: 0
max_temp: 250
min_extrude_temp: 178

[tmc2209 stepper_x]
uart_pin: PC7
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD2
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PC12
run_current: 0.650
hold_current: 0.450
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC11
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999

[fan]
pin: PA8

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control = pid
pid_kp = 72.449
pid_ki = 1.509
pid_kd = 869.386
min_temp: 0
max_temp: 130

[bltouch]
sensor_pin: ^PC6
control_pin: PB1
x_offset: -52
y_offset: -16
z_offset : 0
probe_with_touch_mode: True

[filament_switch_sensor my_sensor]
switch_pin: PB10

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[include mainsail.cfg]

[include timelapse.cfg]


#Mes Macros
[gcode_macro G29]
description : Calibrer le BedMesh
gcode:
    G28
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=LK5pro
    #SAVE_CONFIG
    G0 X0 Y0 Z10 F6000

[gcode_macro PURGE]
description : Purger la buse
gcode:
  #M117 Ligne de purge
  G92 E0 ;Reset Extruder
  # move z axis
  G1 Z2.0 F3000 ;Move Z Axis up
  # move to prime position
  G1 X2 Y30 Z0.28 F5000.0 ;Move to start position
  G1 X2 Y200.0 Z0.28 F1500.0 E15 ;Draw the first line
  G1 X3 Y200.0 Z0.28 F5000.0 ;Move to side a little
  G1 X3 Y50 Z0.28 F1500.0 E30 ;Draw the second line
  G92 E0 ;Reset Extruder
  G1 Z2.0 F3000 ;Move Z Axis up


[gcode_macro START_PRINT]
description : Démarrage de l'impression
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(65)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  #M117 Home sweet home
  # Use absolute coordinates
  G90
  # Reset the G-Code Z offset (adjust Z offset if needed)
  SET_GCODE_OFFSET Z=0.0
  # Home the printer
  G29
  # Move the nozzle near the bed
  G1 X15 Y20 Z5 F6000
  M117 Chauffe Marcel
  # Start bed heating and continue
  M140 S{BED_TEMP}
  M104 S170 # Prechauffe buse
  M190 S{BED_TEMP}
  M109 S{EXTRUDER_TEMP}
  # Prime line
  PURGE
  M117 C’est parti, mon Kiki...

[gcode_macro END_PRINT]
description : Fin de l'impression
gcode:
  M117 C’est fini
  # move z up
  G91
  G1 E-2 Z+10 F3000
  # absolute xy
  G90
  G1 X5 Y295 F2000
  #disable hotend and heated bed
  M104 S0
  M140 S0
  # disable steppers
  M84
  BED_MESH_CLEAR

[gcode_macro CALIBRATE]
description : Calibration des 4 coins (après Z_CALIBRATE)
gcode:
  G28
  G0 X250 Y250 Z10 F6000
  G0 X250 Y250 Z0 F6000
  G4 P30000
  G0 X50 Y250 Z10 F6000
  G0 X50 Y250 Z0 F6000
  G4 P30000
  G0 X50 Y50 Z10 F6000
  G0 X50 Y50 Z0 F6000
  G4 P30000
  G0 X250 Y50 Z10 F6000
  G0 X250 Y50 Z0 F6000
  G4 P30000
  G0 X150 Y150 Z10 F6000
  M84

[gcode_macro Z_CALIBRATE]
description : Calibration de Z)
gcode:
  G28
  PROBE_CALIBRATE
  

[idle_timeout]
timeout = 1200 #20 Minutes
gcode:
  {% if printer.pause_resume.is_paused %}
  M117 "Timeout ignored because printer state == paused."
  {% else %}
  TURN_OFF_MOTORS
  TURN_OFF_HEATERS
  SET_FAN_SPEED FAN=nevermore SPEED=0
  SET_PIN PIN=led_strip VALUE=0
  SET_LED LED=fysetc_mini12864 RED=0.1 GREEN=0.1 BLUE=0.1 INDEX=1 TRANSMIT=0
  SET_LED LED=fysetc_mini12864 RED=0.1 GREEN=0.0996 BLUE=0 INDEX=2 TRANSMIT=0
  SET_LED LED=fysetc_mini12864 RED=0.1 GREEN=0.0996 BLUE=0 INDEX=3
  status_ready ;Stealthburner neopixels
  M117 ;clear M117 messages
  {% endif %}
  

[gcode_macro M600]
description : Commande pour changement du filament
gcode:
  {% set X = params.X|default(50)|float %}
  {% set Y = params.Y|default(0)|float %}
  {% set Z = params.Z|default(10)|float %}
  SAVE_GCODE_STATE NAME=M600_state
  #M300 ;Beep Beep Beep
  #M300
  #M300
  M118 TYPE=command MSG="Changement de Fillament"
  G91
  G1 E-.8 F2700
  G1 Z{Z}
  G90
  G1 X{X} Y{Y} F3000
  G91
  G1 E-50 F1000
  PAUSE
  G1 E50 F100
  RESTORE_GCODE_STATE NAME=M600_state

[respond]
default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

[pause_resume]
recover_velocity: 50
# When capture/restore is enabled, the speed at which to return to the captured position (in mm/s). Default is 50 mm/s

[bed_mesh]
mesh_min: 10, 10
mesh_max: 245, 275
probe_count: 5, 5


[safe_z_home]
home_xy_position: 205, 150 # Change coordinates to the center of your print bed
speed: 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# EXP1 / EXP2 (display) pins
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC1, EXP1_3=PA4, EXP1_5=PA6, EXP1_7=PC4, EXP1_9=<GND>,
    EXP1_2=PC3, EXP1_4=PA5, EXP1_6=PA7, EXP1_8=PC5, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB11, EXP2_5=PB0,  EXP2_7=PC10,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PA15, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>,
    # CR_EXP3 header - additional header dedicated to Creality Ender 3/5 stock screens
    CR_EXP3_10=<5V>, CR_EXP3_8=PA4, CR_EXP3_6=PA6, CR_EXP3_4=<RST>, CR_EXP3_2=PC3,
    CR_EXP3_9=<GND>, CR_EXP3_7=PA5, CR_EXP3_5=PB0, CR_EXP3_3=PB11,  CR_EXP3_1=PC1

